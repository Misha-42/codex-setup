model_provider = "dashscope"
model = "qwen3-coder-flash"
model_reasoning_effort = "low"
# Лимит контекста: не тащим историю и мусор, экономим квоту.
# Дефолт был 200K; 64K хватает и на большие файлы в batch (32K их режет).
# Больше экономии — меньше: model_context_window = 100000
model_context_window = 100000

[model_providers.dashscope]
name = "DashScope Free"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
requires_openai_auth = false
# Сессионный кэш DashScope: 10% цены на попадания (неявный — 20%), проверено на 3 моделях.
# Безопасен: при одиночных запросах ведёт себя так же, как неявный кэш.
http_headers = { x-dashscope-session-cache = "enable" }

# Метаданные моделей: без них codex шлёт fallback и не знает лимиты (warning на старте).
[model_providers.dashscope.models."deepseek-v4-flash"]
name = "deepseek-v4-flash"
context_window = 65536
max_output_tokens = 8192
reasoning = true
tool_call = true

[model_providers.dashscope.models."deepseek-v4-pro"]
name = "deepseek-v4-pro"
context_window = 65536
max_output_tokens = 8192
reasoning = true
tool_call = true

