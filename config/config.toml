# ===== ДЕФОЛТ: DashScope (бесплатный триал). Для DeepSeek замените на: model_provider = "dashscope" =====
model_provider = "dashscope"
model = "qwen3-coder-flash"
review_model = "qwen3.7-plus"
model_reasoning_effort = "low"

# Лимит контекста: не тащим историю и мусор, экономим квоту (дефолт был 200K).
# Меньше — экономнее: 32768 (но режет большие файлы в batch).
model_context_window = 100000
disable_response_storage = true
network_access = "enabled"
windows_wsl_setup_acknowledged = true
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
notify = [
    'C:\Users\user\AppData\Local\OpenAI\Codex\runtimes\cua_node\23828fd353da361d\bin\node_modules\@oai\sky\bin\windows\codex-computer-use.exe',
    "turn-ended",
]

[model_providers.deepseek]
name = "DeepSeek (via DashScope)"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[model_providers.dashscope]
name = "DashScope"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# Сессионный кэш DashScope: 10% цены на попадания (неявный — 20%), проверено на 3 моделях.
http_headers = { x-dashscope-session-cache = "enable" }

# Метаданные моделей: без них codex шлёт fallback и не знает лимиты (warning на старте).
